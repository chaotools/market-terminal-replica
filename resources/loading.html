<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>久赢恒丰 · 逐项复刻</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1b33; overflow: hidden; }
    .wrap {
      height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: #dbe6f3; font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .logo { width: 84px; height: 84px; border-radius: 18px; background: linear-gradient(135deg, #1d4f86, #2f7ac0); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: #fff; }
    .title { font-size: 18px; font-weight: 600; letter-spacing: 2px; }
    .sub { font-size: 12px; color: #8fa8c4; }
    .spinner { width: 22px; height: 22px; border: 2px solid rgba(219, 230, 243, .35); border-top-color: #dbe6f3; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">久</div>
    <div class="title">久赢恒丰 · 逐项复刻</div>
    <div class="spinner"></div>
    <div class="sub">正在启动本地数据服务…</div>
  </div>
</body>
</html>
